<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steno &mdash; a notebook that stays on your desk</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="notebook" id="notebook">

    <!-- Tab rail: one tab per page, plus an "add" tab -->
    <nav class="tab-rail" id="tabRail" aria-label="Pages">
      <!-- tabs injected by app.js -->
    </nav>

    <!-- The open page -->
    <main class="page" id="page">
      <header class="page-head">
        <input
          id="pageTitle"
          class="page-title"
          type="text"
          maxlength="60"
          autocomplete="off"
          spellcheck="false"
          aria-label="Page title"
        />
        <input
          id="pageDate"
          class="page-date"
          type="text"
          maxlength="40"
          autocomplete="off"
          spellcheck="false"
          aria-label="Page date"
        />
        <button id="deleteBtn" class="delete-btn" title="Tear out this page" aria-label="Delete this page">
          <svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true">
            <path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6M6 6l.7 10.2a1.5 1.5 0 0 0 1.5 1.4h3.6a1.5 1.5 0 0 0 1.5-1.4L14 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <textarea
        id="pageBody"
        class="page-body"
        placeholder="Start writing&hellip;"
        spellcheck="true"
      ></textarea>

      <footer class="page-foot">
        <span id="wordCount">0 words</span>
        <span id="savedAt" class="saved-at" aria-live="polite"></span>
      </footer>
    </main>

    <!-- Shown only when every page has been torn out -->
    <div class="empty-state" id="emptyState" hidden>
      <p>This notebook is empty.</p>
      <button id="emptyAddBtn" class="empty-add-btn">Add a page</button>
    </div>

  </div>

  <!-- Settings entry point: fixed to the viewport so it's reachable from any page -->
  <button id="settingsBtn" class="settings-btn" aria-label="Open settings" title="Settings">
    <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
      <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
  </button>

  <!-- Settings panel -->
  <div id="settingsOverlay" class="settings-overlay" hidden>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-label="Settings">
      <header class="settings-head">
        <h2>Settings</h2>
        <button id="settingsClose" class="settings-close" aria-label="Close settings">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <section class="settings-section">
        <h3>Theme</h3>
        <div class="swatch-row" id="themeRow">
          <button class="swatch" data-value="steno" style="--sw-a:#FBF3D9;--sw-b:#3e5c4e">
            <span class="swatch-chip"></span>Steno
          </button>
          <button class="swatch" data-value="midnight" style="--sw-a:#20232a;--sw-b:#4fb7ad">
            <span class="swatch-chip"></span>Midnight
          </button>
          <button class="swatch" data-value="manuscript" style="--sw-a:#f2e6c9;--sw-b:#6b3230">
            <span class="swatch-chip"></span>Manuscript
          </button>
          <button class="swatch" data-value="slate" style="--sw-a:#f7f9fb;--sw-b:#3d4fc0">
            <span class="swatch-chip"></span>Slate
          </button>
        </div>
      </section>

      <section class="settings-section">
        <h3>Paper</h3>
        <div class="option-row" id="paperRow">
          <button class="option-btn" data-value="ruled">Ruled</button>
          <button class="option-btn" data-value="grid">Grid</button>
          <button class="option-btn" data-value="blank">Blank</button>
        </div>
      </section>

      <section class="settings-section">
        <h3>Typeface</h3>
        <div class="option-row" id="fontRow">
          <button class="option-btn font-mono" data-value="mono">Mono</button>
          <button class="option-btn font-serif" data-value="serif">Serif</button>
          <button class="option-btn font-sans" data-value="sans">Sans</button>
          <button class="option-btn font-hand" data-value="hand">Hand</button>
        </div>
      </section>

      <section class="settings-section">
        <h3>Text size</h3>
        <div class="option-row" id="sizeRow">
          <button class="option-btn" data-value="14">S</button>
          <button class="option-btn" data-value="16">M</button>
          <button class="option-btn" data-value="18">L</button>
          <button class="option-btn" data-value="21">XL</button>
        </div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
