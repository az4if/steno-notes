<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steno &mdash; a notebook that stays on your desk</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="notebook" id="notebook">

    <!-- Tab rail: one tab per page, plus an "add" tab -->
    <nav class="tab-rail" id="tabRail" aria-label="Pages">
      <!-- tabs injected by app.js -->
    </nav>

    <!-- The open page -->
    <main class="page" id="page">
      <header class="page-head">
        <input
          id="pageTitle"
          class="page-title"
          type="text"
          maxlength="60"
          autocomplete="off"
          spellcheck="false"
          aria-label="Page title"
        />
        <button id="deleteBtn" class="delete-btn" title="Tear out this page" aria-label="Delete this page">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6M6 6l.7 10.2a1.5 1.5 0 0 0 1.5 1.4h3.6a1.5 1.5 0 0 0 1.5-1.4L14 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <textarea
        id="pageBody"
        class="page-body"
        placeholder="Start writing&hellip;"
        spellcheck="true"
      ></textarea>

      <footer class="page-foot">
        <span id="wordCount">0 words</span>
        <span id="savedAt" class="saved-at" aria-live="polite"></span>
      </footer>
    </main>

    <!-- Shown only when every page has been torn out -->
    <div class="empty-state" id="emptyState" hidden>
      <p>This notebook is empty.</p>
      <button id="emptyAddBtn" class="empty-add-btn">Add a page</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
